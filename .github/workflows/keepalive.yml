name: Keep schedule alive
# GitHub pauses scheduled jobs after 60 days without repository activity.
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "newsroom-bot"
          git config user.email "newsroom-bot@users.noreply.github.com"
          git commit --allow-empty -m "keepalive"
          git push
