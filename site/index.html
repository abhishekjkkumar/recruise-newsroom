<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruise Live Newsroom</title>
<meta name="description" content="Recruise · The World of Work. Business. Technology. People. Ideas.">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="assets/mark_purple.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">

  <header class="top">
    <div class="brand">
      <img class="lockup" src="assets/lockup_white.png" alt="Recruise">
      <span class="rule"></span>
      <div class="theme">
        <div class="eyebrow">The World of Work</div>
        <div class="tagline">Business. Technology. <b>People.</b> Ideas.</div>
      </div>
    </div>
    <div class="now">
      <div class="live"><span class="dot"></span>LIVE NEWSROOM</div>
      <div class="clockwrap">
        <div id="clock">--:--</div>
        <div id="date"></div>
      </div>
    </div>
  </header>

  <main class="grid">
    <section class="feature" id="feature">
      <div class="f-slide" id="fA"></div>
      <div class="f-slide" id="fB"></div>
      <div class="f-progress"><span id="fBar"></span></div>
    </section>

    <aside class="latest">
      <div class="sec-head"><span class="pin"></span>Latest coverage</div>
      <div id="latestList" class="latest-list"></div>
    </aside>

    <section class="cards" id="cards"></section>
  </main>

  <footer class="ticker">
    <div class="t-label">HEADLINES</div>
    <div class="t-window"><div class="t-track" id="tTrack"></div></div>
    <div class="t-updated" id="updated">Connecting…</div>
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
